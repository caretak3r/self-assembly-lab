<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="330" fill="#ffffff"/>
<text x="360" y="22" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">Talking with light in a robot swarm arena (schematic, not data)</text>
<text x="120" y="55" font-size="13" text-anchor="middle" fill="#333">1. 12-LED ring on each robot</text>
<circle cx="120" cy="150" r="66" fill="#eeeeee" stroke="#999"/>
<circle cx="120.0" cy="98.0" r="8" fill="#f6b26b" stroke="#333"/>
<circle cx="146.0" cy="105.0" r="8" fill="#555555" stroke="#333"/>
<circle cx="165.0" cy="124.0" r="8" fill="#f6b26b" stroke="#333"/>
<circle cx="172.0" cy="150.0" r="8" fill="#555555" stroke="#333"/>
<circle cx="165.0" cy="176.0" r="8" fill="#f6b26b" stroke="#333"/>
<circle cx="146.0" cy="195.0" r="8" fill="#555555" stroke="#333"/>
<circle cx="120.0" cy="202.0" r="8" fill="#f6b26b" stroke="#333"/>
<circle cx="94.0" cy="195.0" r="8" fill="#f6b26b" stroke="#333"/>
<circle cx="75.0" cy="176.0" r="8" fill="#555555" stroke="#333"/>
<circle cx="68.0" cy="150.0" r="8" fill="#f6b26b" stroke="#333"/>
<circle cx="75.0" cy="124.0" r="8" fill="#555555" stroke="#333"/>
<circle cx="94.0" cy="105.0" r="8" fill="#555555" stroke="#333"/>
<line x1="120" y1="150" x2="120" y2="112" stroke="#c00" stroke-width="3" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c00"/></marker></defs>
<text x="120" y="240" font-size="11" text-anchor="middle" fill="#555">lit/unlit pattern = heading</text>
<text x="120" y="255" font-size="11" text-anchor="middle" fill="#555">plus a short state code</text>
<text x="120" y="270" font-size="11" text-anchor="middle" fill="#555">(52 usable codes)</text>
<line x1="240" y1="45" x2="240" y2="310" stroke="#ddd"/><line x1="490" y1="45" x2="490" y2="310" stroke="#ddd"/>
<text x="365" y="55" font-size="13" text-anchor="middle" fill="#333">2. Camera up, projector down</text>
<rect x="330" y="68" width="30" height="18" fill="#4a7fb5"/><text x="345" y="100" font-size="10" text-anchor="middle" fill="#333">camera</text>
<rect x="372" y="68" width="30" height="18" fill="#6aa84f"/><text x="387" y="100" font-size="10" text-anchor="middle" fill="#333">projector</text>
<rect x="262" y="200" width="206" height="80" fill="#f4f4f4" stroke="#999"/>
<line x1="345" y1="86" x2="300" y2="200" stroke="#4a7fb5" stroke-dasharray="4 3"/><line x1="345" y1="86" x2="430" y2="200" stroke="#4a7fb5" stroke-dasharray="4 3"/>
<polygon points="387,86 330,200 450,200" fill="#6aa84f" fill-opacity="0.15"/>
<circle cx="300" cy="240" r="9" fill="#ddd" stroke="#333"/><circle cx="300" cy="240" r="3" fill="#f6b26b"/>
<circle cx="350" cy="255" r="9" fill="#ddd" stroke="#333"/><circle cx="350" cy="255" r="3" fill="#f6b26b"/>
<circle cx="410" cy="230" r="9" fill="#ddd" stroke="#333"/><circle cx="410" cy="230" r="3" fill="#f6b26b"/>
<circle cx="440" cy="262" r="9" fill="#ddd" stroke="#333"/><circle cx="440" cy="262" r="3" fill="#f6b26b"/>
<text x="365" y="298" font-size="11" text-anchor="middle" fill="#555">robots report up with LEDs; light cues and</text>
<text x="365" y="312" font-size="11" text-anchor="middle" fill="#555">infrared commands come back down</text>
<text x="605" y="55" font-size="13" text-anchor="middle" fill="#333">3. Virtual pheromones</text>
<defs><radialGradient id="g"><stop offset="0" stop-color="#6aa84f" stop-opacity="0.9"/><stop offset="1" stop-color="#6aa84f" stop-opacity="0"/></radialGradient><radialGradient id="r"><stop offset="0" stop-color="#cc4125" stop-opacity="0.8"/><stop offset="1" stop-color="#cc4125" stop-opacity="0"/></radialGradient></defs>
<rect x="510" y="75" width="190" height="160" fill="#fafafa" stroke="#999"/>
<circle cx="580" cy="150" r="55" fill="url(#g)"/><circle cx="660" cy="110" r="30" fill="url(#r)"/>
<circle cx="570" cy="140" r="6" fill="#ddd" stroke="#333"/>
<circle cx="590" cy="160" r="6" fill="#ddd" stroke="#333"/>
<circle cx="575" cy="165" r="6" fill="#ddd" stroke="#333"/>
<circle cx="600" cy="140" r="6" fill="#ddd" stroke="#333"/>
<circle cx="672" cy="200" r="6" fill="#ddd" stroke="#333"/><path d="M672 192 L688 176" stroke="#333" marker-end="url(#ar)"/>
<text x="605" y="258" font-size="11" text-anchor="middle" fill="#555">green: explore, follow, then pause</text>
<text x="605" y="273" font-size="11" text-anchor="middle" fill="#555">red: avoid</text>
<text x="605" y="288" font-size="11" text-anchor="middle" fill="#555">the computer adds light where robots</text>
<text x="605" y="303" font-size="11" text-anchor="middle" fill="#555">linger and lets it fade (evaporation)</text>
</svg>