<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Sketch of Fluidic Body: open hand soft swarm flows around obstacle; closed hand hard swarm pushes a box">
  <title>Fluidic Body sketch (original illustration)</title>
  <rect width="720" height="320" fill="#f8fafc"/>
  <!-- Left panel: open hand, soft -->
  <rect x="20" y="20" width="330" height="280" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="185" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">Open hand: soft swarm</text>
  <!-- hand open -->
  <g transform="translate(55,90)">
    <ellipse cx="40" cy="70" rx="22" ry="30" fill="#fcd34d" stroke="#b45309"/>
    <rect x="28" y="20" width="8" height="40" rx="4" fill="#fcd34d" stroke="#b45309"/>
    <rect x="40" y="12" width="8" height="48" rx="4" fill="#fcd34d" stroke="#b45309"/>
    <rect x="52" y="16" width="8" height="44" rx="4" fill="#fcd34d" stroke="#b45309"/>
    <rect x="64" y="24" width="8" height="36" rx="4" fill="#fcd34d" stroke="#b45309"/>
  </g>
  <!-- soft robots flowing around obstacle -->
  <circle cx="200" cy="160" r="28" fill="#cbd5e1" stroke="#64748b"/>
  <text x="200" y="165" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">obstacle</text>
  <!-- scattered soft robots -->
  <circle cx="155" cy="120" r="8" fill="#38bdf8"/><circle cx="170" cy="145" r="8" fill="#38bdf8"/>
  <circle cx="155" cy="175" r="8" fill="#38bdf8"/><circle cx="175" cy="200" r="8" fill="#38bdf8"/>
  <circle cx="230" cy="120" r="8" fill="#38bdf8"/><circle cx="250" cy="145" r="8" fill="#38bdf8"/>
  <circle cx="245" cy="185" r="8" fill="#38bdf8"/><circle cx="225" cy="210" r="8" fill="#38bdf8"/>
  <circle cx="265" cy="165" r="8" fill="#38bdf8"/><circle cx="140" cy="150" r="8" fill="#38bdf8"/>
  <path d="M120 130 Q150 160 120 190" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M280 130 Q250 160 280 190" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="185" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#334155">flows and deforms around barriers</text>

  <!-- Right panel: closed hand, hard -->
  <rect x="370" y="20" width="330" height="280" rx="12" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="535" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#78350f">Closed hand: hard swarm</text>
  <!-- fist -->
  <g transform="translate(400,100)">
    <ellipse cx="40" cy="55" rx="28" ry="26" fill="#fcd34d" stroke="#b45309"/>
    <rect x="18" y="35" width="12" height="20" rx="4" fill="#f59e0b" stroke="#b45309"/>
  </g>
  <!-- tight cluster of robots -->
  <g>
    <circle cx="500" cy="150" r="9" fill="#f97316"/><circle cx="516" cy="150" r="9" fill="#f97316"/>
    <circle cx="508" cy="136" r="9" fill="#ea580c"/><circle cx="508" cy="164" r="9" fill="#ea580c"/>
    <circle cx="524" cy="136" r="9" fill="#ea580c"/><circle cx="524" cy="164" r="9" fill="#ea580c"/>
    <circle cx="532" cy="150" r="9" fill="#f97316"/>
  </g>
  <!-- arrow push -->
  <path d="M545 150 L590 150" stroke="#9a3412" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9a3412"/>
    </marker>
  </defs>
  <!-- box being pushed -->
  <rect x="600" y="125" width="50" height="50" rx="4" fill="#a8a29e" stroke="#57534e"/>
  <text x="625" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1c1917">box</text>
  <text x="535" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#78350f">stays together and can push objects</text>
</svg>
