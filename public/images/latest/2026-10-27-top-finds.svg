<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <!-- Panel 1: bristlebot flock with safety bubbles heading to a light -->
  <g transform="translate(15,20)">
    <rect width="280" height="290" rx="14" fill="#f3f7ff" stroke="#9db4e0"/>
    <text x="140" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3b70">1. Flock without crashing</text>
    <circle cx="235" cy="75" r="26" fill="#ffe08a" opacity="0.8"/>
    <text x="235" y="80" text-anchor="middle" font-size="12" fill="#7a5a00">light</text>
    <g fill="none" stroke="#9db4e0" stroke-dasharray="4 3">
      <circle cx="80" cy="200" r="22"/><circle cx="125" cy="180" r="22"/><circle cx="100" cy="150" r="22"/><circle cx="150" cy="135" r="22"/><circle cx="60" cy="155" r="22"/>
    </g>
    <g fill="#1f3b70">
      <ellipse cx="80" cy="200" rx="10" ry="5" transform="rotate(-35 80 200)"/>
      <ellipse cx="125" cy="180" rx="10" ry="5" transform="rotate(-35 125 180)"/>
      <ellipse cx="100" cy="150" rx="10" ry="5" transform="rotate(-35 100 150)"/>
      <ellipse cx="150" cy="135" rx="10" ry="5" transform="rotate(-35 150 135)"/>
      <ellipse cx="60" cy="155" rx="10" ry="5" transform="rotate(-35 60 155)"/>
    </g>
    <path d="M165 125 L205 95" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
    <text x="140" y="255" text-anchor="middle" font-size="12" fill="#333">dashed rings = safety bubbles;</text>
    <text x="140" y="270" text-anchor="middle" font-size="12" fill="#333">each robot plans its own path</text>
  </g>
  <!-- Panel 2: wrinkles unfold into a curved surface -->
  <g transform="translate(310,20)">
    <rect width="280" height="290" rx="14" fill="#f4fbf2" stroke="#9fd39a"/>
    <text x="140" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#245b20">2. Unfold wrinkles into a dome</text>
    <path d="M40 110 l10 -14 l10 14 l10 -14 l10 14 l6 -8 l6 8 l6 -8 l6 8 l6 -8 l6 8 l10 -14 l10 14 l10 -14 l10 14" fill="none" stroke="#3c8c35" stroke-width="3"/>
    <text x="140" y="70" text-anchor="middle" font-size="12">folded: tight wrinkles in the middle</text>
    <path d="M140 130 L140 165" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
    <text x="190" y="152" text-anchor="middle" font-size="12">inflate / pull</text>
    <path d="M40 240 Q140 150 240 240" fill="#c6e8c2" stroke="#3c8c35" stroke-width="3"/>
    <text x="140" y="270" text-anchor="middle" font-size="12">unfolded: more stretch where</text>
    <text x="140" y="285" text-anchor="middle" font-size="12">wrinkles were denser = curve</text>
  </g>
  <!-- Panel 3: droplet spun by swimmers at its edge -->
  <g transform="translate(605,20)">
    <rect width="280" height="290" rx="14" fill="#fff6ef" stroke="#e8b48a"/>
    <text x="140" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a3d0d">3. Swimmers spin a droplet</text>
    <circle cx="80" cy="120" r="50" fill="#ffd0a8" stroke="#7a3d0d" stroke-width="2"/>
    <g fill="#7a3d0d">
      <ellipse cx="80" cy="70" rx="7" ry="3"/><ellipse cx="130" cy="120" rx="3" ry="7"/><ellipse cx="80" cy="170" rx="7" ry="3"/><ellipse cx="30" cy="120" rx="3" ry="7"/>
    </g>
    <path d="M120 85 A50 50 0 0 1 128 100" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M40 155 A50 50 0 0 1 32 140" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <!-- illustrative omega vs R curve -->
    <g transform="translate(160,60)">
      <line x1="0" y1="110" x2="105" y2="110" stroke="#333"/><line x1="0" y1="0" x2="0" y2="110" stroke="#333"/>
      <path d="M10 10 Q 20 70 100 95" fill="none" stroke="#e07b00" stroke-width="3"/>
      <text x="52" y="126" text-anchor="middle" font-size="11">droplet size</text>
      <text x="-8" y="55" text-anchor="middle" font-size="11" transform="rotate(-90 -8 55)">spin rate</text>
    </g>
    <text x="140" y="225" text-anchor="middle" font-size="12" fill="#333">same edge speed: bigger droplet</text>
    <text x="140" y="240" text-anchor="middle" font-size="12" fill="#333">turns slower (spin ~ 1/size)</text>
    <text x="140" y="270" text-anchor="middle" font-size="11" fill="#777">sketch only, not data</text>
  </g>
</svg>
