<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" font-family="Helvetica, Arial, sans-serif">
  <rect width="560" height="320" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">More phase levels, more light focused</text>
  <line x1="80" y1="260" x2="500" y2="260" stroke="#444"/>
  <line x1="80" y1="60" x2="80" y2="260" stroke="#444"/>
  <g font-size="12" fill="#555" text-anchor="end">
    <text x="72" y="264">0%</text><text x="72" y="214">20%</text><text x="72" y="164">40%</text><text x="72" y="114">60%</text>
  </g>
  <g stroke="#ddd"><line x1="80" y1="210" x2="500" y2="210"/><line x1="80" y1="160" x2="500" y2="160"/><line x1="80" y1="110" x2="500" y2="110"/></g>
  <rect x="150" y="204" width="100" height="56" fill="#9bb7d4"/>
  <rect x="330" y="123" width="100" height="137" fill="#2f6fae"/>
  <g font-size="14" text-anchor="middle" fill="#222">
    <text x="200" y="196">22.4%</text><text x="380" y="115">54.8%</text>
    <text x="200" y="282">2 phase levels</text><text x="380" y="282">6 phase levels</text>
  </g>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#666">Measured focusing efficiency of single graphene oxide lenses (values from the arXiv:2610.36373 abstract)</text>
  <text x="24" y="160" font-size="12" fill="#555" transform="rotate(-90 24 160)" text-anchor="middle">Focusing efficiency</text>
</svg>
