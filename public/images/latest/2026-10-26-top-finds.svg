<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <!-- Panel 1: growing a shape one attachment site at a time -->
  <g transform="translate(15,20)">
    <rect width="280" height="290" rx="14" fill="#f3f7ff" stroke="#9db4e0"/>
    <text x="140" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3b70">1. Grow a shape by local rules</text>
    <g fill="#1f3b70">
      <circle cx="110" cy="90" r="10"/><circle cx="140" cy="90" r="10"/><circle cx="170" cy="90" r="10"/>
      <circle cx="110" cy="120" r="10"/><circle cx="110" cy="150" r="10"/><circle cx="140" cy="150" r="10"/>
      <circle cx="110" cy="180" r="10"/><circle cx="110" cy="210" r="10"/><circle cx="140" cy="210" r="10"/>
    </g>
    <circle cx="170" cy="150" r="10" fill="none" stroke="#e07b00" stroke-width="3" stroke-dasharray="4 3"/>
    <circle cx="170" cy="210" r="10" fill="none" stroke="#e07b00" stroke-width="3" stroke-dasharray="4 3"/>
    <circle cx="240" cy="250" r="10" fill="#9db4e0"/>
    <path d="M230 245 L182 214" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
    <text x="140" y="270" text-anchor="middle" font-size="12" fill="#333">orange rings = open spots the</text>
    <text x="140" y="285" text-anchor="middle" font-size="12" fill="#333">formation itself advertises</text>
  </g>
  <!-- Panel 2: budding -->
  <g transform="translate(310,20)">
    <rect width="280" height="290" rx="14" fill="#f4fbf2" stroke="#9fd39a"/>
    <text x="140" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#245b20">2. A robot that buds a copy</text>
    <g fill="#3c8c35"><rect x="30" y="80" width="34" height="34" rx="6"/><rect x="68" y="80" width="34" height="34" rx="6"/><rect x="106" y="80" width="34" height="34" rx="6"/></g>
    <text x="85" y="135" text-anchor="middle" font-size="12">parent (keeps its parts)</text>
    <g fill="#c6e8c2" stroke="#3c8c35"><rect x="190" y="70" width="30" height="30" rx="6"/><rect x="230" y="95" width="30" height="30" rx="6"/><rect x="200" y="120" width="30" height="30" rx="6"/></g>
    <text x="225" y="168" text-anchor="middle" font-size="12">spare modules</text>
    <path d="M140 190 L140 215" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
    <g fill="#3c8c35"><rect x="20" y="230" width="30" height="30" rx="6"/><rect x="54" y="230" width="30" height="30" rx="6"/><rect x="88" y="230" width="30" height="30" rx="6"/></g>
    <g fill="#7cc674"><rect x="160" y="230" width="30" height="30" rx="6"/><rect x="194" y="230" width="30" height="30" rx="6"/><rect x="228" y="230" width="30" height="30" rx="6"/></g>
    <text x="140" y="280" text-anchor="middle" font-size="12">parent + new identical "bud"</text>
  </g>
  <!-- Panel 3: huddle -->
  <g transform="translate(605,20)">
    <rect width="280" height="290" rx="14" fill="#fff6ef" stroke="#e8b48a"/>
    <text x="140" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a3d0d">3. Huddle to survive the cold</text>
    <circle cx="140" cy="150" r="80" fill="#dbe9ff"/>
    <circle cx="140" cy="150" r="42" fill="#ffd0a8"/>
    <g fill="#7a3d0d">
      <circle cx="140" cy="150" r="9"/><circle cx="120" cy="138" r="9"/><circle cx="160" cy="138" r="9"/><circle cx="125" cy="166" r="9"/><circle cx="155" cy="166" r="9"/>
      <circle cx="140" cy="90" r="9"/><circle cx="195" cy="120" r="9"/><circle cx="198" cy="180" r="9"/><circle cx="140" cy="212" r="9"/><circle cx="84" cy="180" r="9"/><circle cx="86" cy="118" r="9"/>
    </g>
    <path d="M200 112 C 185 95 165 90 152 100" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M128 160 C 110 185 100 195 95 190" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="140" y="255" text-anchor="middle" font-size="12">warm core, cold rim; robots</text>
    <text x="140" y="270" text-anchor="middle" font-size="12">take turns, like penguins</text>
  </g>
</svg>
