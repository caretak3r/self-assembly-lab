<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="sans-serif" font-size="13">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold">Sketch: branching with a delay makes a filament family drift backward</text>
  <text x="70" y="58" font-size="12" fill="#555">pole side (minus ends)</text>
  <text x="520" y="58" font-size="12" fill="#555">chromosome side (plus ends)</text>
  <!-- generation rows -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="380" y1="100" x2="620" y2="100" stroke="#1f77b4"/>
    <line x1="290" y1="160" x2="530" y2="160" stroke="#2ca02c"/>
    <line x1="200" y1="220" x2="440" y2="220" stroke="#ff7f0e"/>
    <line x1="110" y1="280" x2="350" y2="280" stroke="#d62728"/>
  </g>
  <g fill="#000">
    <polygon points="620,93 636,100 620,107"/>
    <polygon points="530,153 546,160 530,167"/>
    <polygon points="440,213 456,220 440,227"/>
    <polygon points="350,273 366,280 350,287"/>
  </g>
  <g stroke="#777" stroke-dasharray="4 3" stroke-width="1.5" fill="none">
    <path d="M 410 100 L 330 160"/>
    <path d="M 320 160 L 240 220"/>
    <path d="M 230 220 L 150 280"/>
  </g>
  <g font-size="12">
    <text x="640" y="104">gen 1</text>
    <text x="550" y="164">gen 2</text>
    <text x="460" y="224">gen 3</text>
    <text x="370" y="284">gen 4</text>
    <text x="420" y="132" fill="#555">branch site on old lattice near minus end</text>
  </g>
  <line x1="600" y1="300" x2="470" y2="300" stroke="#444" stroke-width="2"/>
  <polygon points="470,294 456,300 470,306" fill="#444"/>
  <text x="480" y="316" font-size="12" fill="#444">family drifts toward the pole</text>
  <text x="20" y="316" font-size="11" fill="#888">Arrowheads = plus ends (each filament still grows to the right)</text>
</svg>
