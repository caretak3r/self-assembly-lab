<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <!-- Panel 1: swarm energy terms -->
  <g transform="translate(15,20)">
    <rect width="280" height="290" rx="14" fill="#f3f7ff" stroke="#9db4e0"/>
    <text x="140" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3b70">1. Mix-and-match swarm rules</text>
    <rect x="20" y="50" width="70" height="30" rx="6" fill="#ffd27f"/><text x="55" y="70" text-anchor="middle" font-size="12">stay close</text>
    <rect x="105" y="50" width="70" height="30" rx="6" fill="#a8e6a3"/><text x="140" y="70" text-anchor="middle" font-size="12">avoid hits</text>
    <rect x="190" y="50" width="70" height="30" rx="6" fill="#f7a8c4"/><text x="225" y="70" text-anchor="middle" font-size="12">go to goal</text>
    <path d="M55 82 L140 118 M140 82 L140 118 M225 82 L140 118" stroke="#555" stroke-width="2" fill="none"/>
    <rect x="80" y="118" width="120" height="30" rx="6" fill="#1f3b70"/><text x="140" y="138" text-anchor="middle" font-size="12" fill="#fff">one controller</text>
    <path d="M140 150 L140 175" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
    <g fill="#1f3b70">
      <circle cx="70" cy="215" r="7"/><circle cx="100" cy="200" r="7"/><circle cx="130" cy="225" r="7"/><circle cx="160" cy="205" r="7"/><circle cx="190" cy="230" r="7"/><circle cx="215" cy="210" r="7"/><circle cx="95" cy="245" r="7"/><circle cx="160" cy="250" r="7"/>
    </g>
    <text x="140" y="278" text-anchor="middle" font-size="12" fill="#333">same drones, many missions</text>
  </g>
  <!-- Panel 2: DNA origami tube unrolls -->
  <g transform="translate(310,20)">
    <rect width="280" height="290" rx="14" fill="#f2fbf6" stroke="#8fcca8"/>
    <text x="140" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c5a3a">2. A DNA tube that unrolls</text>
    <ellipse cx="60" cy="120" rx="18" ry="40" fill="#cfe9ff" stroke="#2b6cb0" stroke-width="2"/>
    <rect x="60" y="80" width="60" height="80" fill="#cfe9ff" stroke="none"/>
    <path d="M60 80 L120 80 M60 160 L120 160" stroke="#2b6cb0" stroke-width="2"/>
    <ellipse cx="120" cy="120" rx="18" ry="40" fill="#e6f3ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="90" y="185" text-anchor="middle" font-size="12" fill="#333">closed: hidden</text>
    <text x="140" y="108" text-anchor="middle" font-size="11" fill="#1c5a3a">key</text>
    <text x="140" y="122" text-anchor="middle" font-size="11" fill="#1c5a3a">signal</text>
    <path d="M150 120 L175 120" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
    <rect x="185" y="70" width="80" height="100" fill="#cfe9ff" stroke="#2b6cb0" stroke-width="2"/>
    <g fill="#e8a33d"><circle cx="205" cy="95" r="6"/><circle cx="245" cy="95" r="6"/><circle cx="225" cy="120" r="6"/><circle cx="205" cy="145" r="6"/><circle cx="245" cy="145" r="6"/></g>
    <text x="225" y="185" text-anchor="middle" font-size="12" fill="#333">open: 5 binders shown</text>
    <text x="140" y="245" text-anchor="middle" font-size="12" fill="#333">shape change decides</text>
    <text x="140" y="262" text-anchor="middle" font-size="12" fill="#333">when the pattern is exposed</text>
  </g>
  <!-- Panel 3: droplet drying in 1 g vs microgravity -->
  <g transform="translate(605,20)">
    <rect width="280" height="290" rx="14" fill="#fff6ef" stroke="#e5b08a"/>
    <text x="140" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a3d12">3. Drying drops in space</text>
    <text x="70" y="60" text-anchor="middle" font-size="13" fill="#333">1 g</text>
    <text x="210" y="60" text-anchor="middle" font-size="13" fill="#333">microgravity</text>
    <path d="M20 150 Q70 80 120 150 Z" fill="#d7ecff" stroke="#2b6cb0" stroke-width="2"/>
    <path d="M45 130 C55 100 85 100 95 130" stroke="#d9534f" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M160 150 Q210 80 260 150 Z" fill="#d7ecff" stroke="#2b6cb0" stroke-width="2"/>
    <line x1="10" y1="152" x2="130" y2="152" stroke="#555" stroke-width="3"/>
    <line x1="150" y1="152" x2="270" y2="152" stroke="#555" stroke-width="3"/>
    <text x="70" y="172" text-anchor="middle" font-size="11" fill="#333">extra stirring</text>
    <text x="210" y="172" text-anchor="middle" font-size="11" fill="#333">calmer drying</text>
    <g fill="#444"><circle cx="30" cy="215" r="5"/><circle cx="55" cy="210" r="5"/><circle cx="85" cy="220" r="5"/><circle cx="110" cy="212" r="5"/></g>
    <g fill="#444"><circle cx="175" cy="214" r="5"/><circle cx="186" cy="214" r="5"/><circle cx="197" cy="214" r="5"/><circle cx="208" cy="214" r="5"/><circle cx="219" cy="214" r="5"/><circle cx="230" cy="214" r="5"/><circle cx="241" cy="214" r="5"/></g>
    <text x="70" y="245" text-anchor="middle" font-size="11" fill="#333">looser coating</text>
    <text x="210" y="245" text-anchor="middle" font-size="11" fill="#333">denser nanotube coating</text>
    <text x="140" y="275" text-anchor="middle" font-size="12" fill="#333">gravity changes how parts pack</text>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#555"/></marker></defs>
</svg>
