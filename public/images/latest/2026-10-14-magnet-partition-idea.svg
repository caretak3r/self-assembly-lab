<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Idealized illustration of the 1 over N rule for near-contact magnetic attraction when a fixed moment is split into N elements">
<rect width="900" height="360" fill="#0f172a"/>
<text x="20" y="30" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Same total magnet, split into N pieces: contact "stickiness" falls as 1/N</text>
<text x="20" y="52" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Idealized scaling stated in arXiv:2610.14247 (near-field pair energy ~ M^2/N); far-field pull unchanged. Not measured data.</text>
