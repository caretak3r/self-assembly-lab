<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="320" fill="#ffffff"/>
<text x="360" y="22" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">Bending plus stretching in an active filament (schematic, not data)</text>
<text x="120" y="55" font-size="13" text-anchor="middle" fill="#333">1. Chain of links</text>
<line x1="30.0" y1="120.0" x2="60.0" y2="120.0" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><line x1="60.0" y1="120.0" x2="90.0" y2="120.0" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><line x1="90.0" y1="120.0" x2="120.0" y2="120.0" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><line x1="120.0" y1="120.0" x2="150.0" y2="120.0" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><line x1="150.0" y1="120.0" x2="180.0" y2="120.0" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><line x1="180.0" y1="120.0" x2="210.0" y2="120.0" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><circle cx="30.0" cy="120.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="60.0" cy="120.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="90.0" cy="120.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="120.0" cy="120.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="150.0" cy="120.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="180.0" cy="120.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="210.0" cy="120.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="120" y="160" font-size="11" text-anchor="middle" fill="#555">each link can bend at joints</text>
<text x="120" y="175" font-size="11" text-anchor="middle" fill="#555">AND change its own length</text>
<line x1="30.0" y1="225.0" x2="52.0" y2="225.0" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="52.0" y1="225.0" x2="87.7" y2="238.0" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="87.7" y1="238.0" x2="109.4" y2="234.7" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="109.4" y1="234.7" x2="145.1" y2="247.8" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="145.1" y1="247.8" x2="166.9" y2="244.5" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="166.9" y1="244.5" x2="203.7" y2="253.9" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><circle cx="30.0" cy="225.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="52.0" cy="225.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="87.7" cy="238.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="109.4" cy="234.7" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="145.1" cy="247.8" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="166.9" cy="244.5" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="203.7" cy="253.9" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="120" y="290" font-size="11" text-anchor="middle" fill="#555">short = squeezed, long = stretched</text>
<text x="360" y="55" font-size="13" text-anchor="middle" fill="#333">2. Two waves at once</text>
<line x1="270.0" y1="110.0" x2="300.0" y2="110.0" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><line x1="300.0" y1="110.0" x2="327.6" y2="98.3" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><line x1="327.6" y1="98.3" x2="357.6" y2="97.2" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><line x1="357.6" y1="97.2" x2="387.6" y2="98.2" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><line x1="387.6" y1="98.2" x2="415.3" y2="86.7" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><line x1="415.3" y1="86.7" x2="445.2" y2="84.3" stroke="#4a7fb5" stroke-width="6" stroke-linecap="round"/><circle cx="270.0" cy="110.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="300.0" cy="110.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="327.6" cy="98.3" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="357.6" cy="97.2" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="387.6" cy="98.2" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="415.3" cy="86.7" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="445.2" cy="84.3" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="360" y="140" font-size="11" text-anchor="middle" fill="#555">bending wave only</text>
<line x1="270.0" y1="190.0" x2="309.3" y2="190.0" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="309.3" y1="190.0" x2="343.8" y2="175.4" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="343.8" y1="175.4" x2="371.2" y2="174.4" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="371.2" y1="174.4" x2="391.4" y2="175.0" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="391.4" y1="175.0" x2="413.3" y2="165.9" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="413.3" y1="165.9" x2="447.3" y2="163.3" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><circle cx="270.0" cy="190.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="309.3" cy="190.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="343.8" cy="175.4" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="371.2" cy="174.4" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="391.4" cy="175.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="413.3" cy="165.9" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="447.3" cy="163.3" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="360" y="220" font-size="11" text-anchor="middle" fill="#555">bending + length wave, phase A</text>
<line x1="270.0" y1="265.0" x2="303.3" y2="265.0" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="303.3" y1="265.0" x2="324.6" y2="256.0" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="324.6" y1="256.0" x2="345.0" y2="255.2" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="345.0" y1="255.2" x2="373.2" y2="256.2" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="373.2" y1="256.2" x2="408.2" y2="241.6" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><line x1="408.2" y1="241.6" x2="447.1" y2="238.6" stroke="#c0504d" stroke-width="6" stroke-linecap="round"/><circle cx="270.0" cy="265.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="303.3" cy="265.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="324.6" cy="256.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="345.0" cy="255.2" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="373.2" cy="256.2" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="408.2" cy="241.6" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="447.1" cy="238.6" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="360" y="295" font-size="11" text-anchor="middle" fill="#555">bending + length wave, phase B</text>
<text x="365" y="75" font-size="11" fill="#333" text-anchor="middle">timing decides: faster, slower or turning</text>
<text x="600" y="55" font-size="13" text-anchor="middle" fill="#333">3. Lacrymaria-like neck</text>
<ellipse cx="540" cy="200" rx="26" ry="38" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
<path d="M540 162 C 560 120, 600 140, 620 100 S 670 80, 690 95" fill="none" stroke="#6aa84f" stroke-width="5" stroke-linecap="round"/>
<circle cx="690" cy="95" r="6" fill="#6aa84f"/>
<text x="600" y="290" font-size="11" text-anchor="middle" fill="#555">long neck stretches out and snaps back;</text>
<text x="600" y="305" font-size="11" text-anchor="middle" fill="#555">a push at the tip makes it whip and explore</text>
<line x1="240" y1="70" x2="240" y2="300" stroke="#ddd"/><line x1="490" y1="70" x2="490" y2="300" stroke="#ddd"/>
</svg>